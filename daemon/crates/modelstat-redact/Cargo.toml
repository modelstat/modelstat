[package]
name = "modelstat-redact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "modelstat redaction floor: SECRET_FLOOR + entropy pass + additive policy bundle."

[dependencies]
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

# The candle BERT-NER runtime (feature §9.5 / plan D5), OFF by default (heavy,
# CPU-cross-build unproven). The default uses the fail-closed UnavailableNer;
# release/verified builds opt in with `--features candle`.
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dev-dependencies]
serde_json.workspace = true
