[package]
name = "modelstat"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Privacy-first SDK for modelstat — wrap your backend LLM calls and ship redacted usage to a local daemon or the modelstat server, without touching live-request latency."
homepage = "https://modelstat.ai"
repository = "https://github.com/modelstat/modelstat"
keywords = ["llm", "observability", "telemetry", "redaction", "ai"]
categories = ["development-tools", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
blake3 = "1"
sha2 = "0.10"
regex = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }
