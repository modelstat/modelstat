[package]
name = "modelstat-summarizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The summarizer-engine binary. Named `modelstat-summarizer` on disk (§2/§10).
[[bin]]
name = "modelstat-summarizer"
path = "src/main.rs"

# This is the ONLY binary that pulls in modelstat-llm (llama.cpp). Keeping the
# edge here — and nowhere in the collector's tree — is the whole point of the
# two-binary split (feature §1, plan D4).
[dependencies]
modelstat-llm.workspace = true
modelstat-sumclient.workspace = true
modelstat-download.workspace = true
modelstat-service.workspace = true
modelstat-update.workspace = true
modelstat-ingest.workspace = true
serde_json.workspace = true
reqwest.workspace = true
axum = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }

[features]
default = []
# Forward the native llama.cpp backend feature to the engine crate (needs cmake).
llama = ["modelstat-llm/llama"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Drive the server's lifecycle in tests with the mock engine backend.
modelstat-llm = { workspace = true, features = ["mock"] }
