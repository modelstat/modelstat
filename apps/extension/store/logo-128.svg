<!-- Chrome Web Store listing logo. 128x128, flat dark background, no
     alpha. Monogram path scaled 3x from the canonical 32x32 mark to
     fit the 84x84 inset square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ms" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64ECAC" />
      <stop offset="100%" stop-color="#00B1C3" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="#0a0a0a" />
  <rect x="22" y="22" width="84" height="84" rx="20" fill="url(#ms)" />
  <path
    d="M43 82 L43 58 L55 76 L67 58 L67 82 M79 82 L79 46 M91 82 L91 64"
    stroke="#0a0a0a"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
