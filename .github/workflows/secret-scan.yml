name: secret-scan

# Blocks any real-secret-shaped string from entering the repo. Defense-in-depth
# alongside GitHub push protection. Config + allowlist live in .gitleaks.toml.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers every commit, not just the diff
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
