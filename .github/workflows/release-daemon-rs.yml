name: release-daemon-rs

# Release of the Rust daemon (feature §13, plan D9/§8): builds BOTH binaries
# (collector + engine) for all six targets, bakes the prebuilt macOS tray into the
# mac archives, checksums + (optionally) minisign-signs everything, and publishes
# a GitHub Release. The installer + the binary self-updater consume exactly these
# assets.
#
# ZERO-TOUCH. Merging ANY commit that touches `daemon/` ships it end-to-end —
# no version to type, no tag to push, no promote step. The version comes from the
# Conventional Commits since the last `daemon-*` tag, by the same rules the npm
# half uses (.github/scripts/release-plan.mjs): `feat` -> minor, `fix`/`perf`/
# `refactor`/`revert` -> patch, `type!:` or `BREAKING CHANGE` -> major, and
# `chore`/`docs`/`ci`/`test` -> no release at all.
#
# `daemon/Cargo.toml`'s version is therefore OUTPUT, not input: the build stamps
# the resolved version in before compiling (the binary bakes it via
# `env!("CARGO_PKG_VERSION")`), and the release job commits it back to main so a
# local build still reports the right number. Hand-editing it does nothing.
#
# The last released version is read from the TAG, never from the manifest — the
# manifest is CI-written, so trusting it would let one bad stamp compound.
#
# The tag is created by the publish step itself rather than pushed by an earlier
# job ON PURPOSE: a tag pushed with the built-in GITHUB_TOKEN does NOT start a new
# workflow run (GitHub's recursion guard), so a "tag job → release workflow" split
# would silently never release. One workflow sidesteps that with no extra secret.
#
# GA vs test build is decided by the version string alone: a plain `x.y.z` is GA,
# a semver pre-release (`1.1.0-rc.1`) publishes as a GitHub pre-release — kept out
# of `releases/latest`, so it is never an auto-update target and the installer
# turns auto-update off for it.
#
# Signing is conditional (§13 "+ signature when enabled"): macOS codesign +
# notarize run only when the Apple secrets exist; the minisign signature is
# produced only when MINISIGN_SECRET_KEY exists. Absent either, the release still
# ships with SHA256SUMS — the sha256 verification the installer always enforces.

# NOTE: deliberately no `paths:` filter. A path filter here would also be applied
# to tag pushes (where "changed files" is not meaningful) and could skip a real
# release. The cheap `gate` job below decides instead: it skips when this version
# is already tagged, so an ordinary merge to main costs a few seconds and stops.
on:
  push:
    branches: [main]
    tags: ["daemon-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (bare semver, e.g. 1.4.2)"
        required: true
      prerelease:
        description: "Force a pre-release (a version like 1.4.2-rc.1 does this on its own)"
        type: boolean
        default: false

permissions:
  contents: write # create the release + upload assets

concurrency:
  group: release-daemon-rs-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: daemon

jobs:
  # ---- Decide the version + whether there is anything to release ----------
  # One place resolves the version for the whole workflow (the build and release
  # jobs used to duplicate this). Runs on every push to main; when the version is
  # already tagged it costs a few seconds and everything downstream skips.
  gate:
    name: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags: the version is derived from the Conventional
          # Commits since the last `daemon-*` tag, and the default shallow clone
          # has neither.
          fetch-depth: 0

      - name: Resolve version + release decision
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          LEVEL=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            V="$IN_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#daemon-}"
          else
            # Merge to main: the Conventional Commits since the last daemon-* tag
            # decide the version. Same rules as the npm planner
            # (.github/scripts/release-plan.mjs) so both halves of the repo agree:
            #   feat -> minor | fix/perf/refactor/revert -> patch
            #   type!: or BREAKING CHANGE -> major (pre-1.0 clamps to minor)
            #   chore/docs/ci/test/style/build -> nothing
            # The last released version is read from the TAG, never from
            # Cargo.toml — the manifest is now CI-written output, so trusting it
            # would let a bad stamp compound.
            LAST="$(git tag --list 'daemon-*' \
                    | sed 's/^daemon-//' \
                    | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                    | sort -V | tail -1 || true)"

            if [ -z "$LAST" ]; then
              # No release yet: seed from the manifest and ship it as-is.
              V="$(sed -n 's/^version = "\(.*\)"$/\1/p' daemon/Cargo.toml | head -1)"
              LEVEL=initial
              echo "no daemon-* tag yet — seeding from the manifest at $V"
            else
              RANGE="daemon-$LAST..HEAD"
              # Only commits that TOUCHED daemon/ count: a docs or tray-only merge
              # must not cut a daemon release. --no-merges so a squashed PR is
              # judged by its own subject, not the merge commit's.
              SUBJECTS="$(git log "$RANGE" --no-merges --pretty=format:%s -- daemon/ || true)"
              BODIES="$(git log "$RANGE" --no-merges --pretty=format:%b -- daemon/ || true)"

              # Highest level wins. `grep -q` returning 1 is normal here, so each
              # test is a real `if` (a bare `&&` chain would abort under `set -e`).
              LVL=0
              if printf '%s\n' "$SUBJECTS" | grep -qE '^(fix|perf|refactor|revert)(\([^)]*\))?!?:'; then LVL=1; fi
              if printf '%s\n' "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?!?:'; then LVL=2; fi
              if printf '%s\n' "$SUBJECTS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then LVL=3; fi
              if printf '%s\n' "$BODIES" | grep -qE '^BREAKING[ -]CHANGE'; then LVL=3; fi

              # Split with parameter expansion, not a heredoc: a heredoc body
              # inside a YAML block scalar is indentation-sensitive and breaks the
              # moment this step is re-indented.
              MAJ="${LAST%%.*}"; REST="${LAST#*.}"
              MIN="${REST%%.*}"; PAT="${REST#*.}"
              case "$LVL" in
                3) if [ "$MAJ" -eq 0 ]; then MIN=$((MIN + 1)); PAT=0; else MAJ=$((MAJ + 1)); MIN=0; PAT=0; fi; LEVEL=major ;;
                2) MIN=$((MIN + 1)); PAT=0; LEVEL=minor ;;
                1) PAT=$((PAT + 1)); LEVEL=patch ;;
                *) LEVEL=none ;;
              esac
              V="$MAJ.$MIN.$PAT"
              echo "since daemon-$LAST: bump=$LEVEL -> $V"
              printf '%s\n' "$SUBJECTS" | sed 's/^/  · /'
            fi
          fi
          V="${V#v}"

          # Fail LOUD rather than silently skipping a release we meant to ship.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::could not resolve a semver version (got '$V')"; exit 1; }

          # A semver pre-release (1.1.0-rc.1) publishes as a GitHub pre-release:
          # out of `releases/latest`, so never an auto-update target. Plain = GA.
          # NB: a bare `A && B && PRE=true` here would abort the whole step under
          # `set -e` whenever A is false, so this stays a real `if`.
          case "$V" in *-*) PRE=true ;; *) PRE=false ;; esac
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_PRERELEASE" = "true" ]; then
            PRE=true
          fi

          # Only a branch push needs the already-shipped guard: an explicit tag
          # push or manual dispatch is someone asking for this release on purpose.
          REL=true
          if [ "$LEVEL" = "none" ]; then
            echo "no releasable commits under daemon/ since daemon-$LAST — nothing to release."
            REL=false
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ] \
             && git ls-remote --exit-code origin "refs/tags/daemon-$V" >/dev/null 2>&1; then
            echo "daemon-$V is already tagged — nothing to release."
            REL=false
          fi

          { echo "version=$V"; echo "prerelease=$PRE"; echo "release=$REL"; } >> "$GITHUB_OUTPUT"
          echo "resolved: version=$V prerelease=$PRE release=$REL"

  # ---- Build + package both binaries for every target ---------------------
  build:
    name: build (${{ matrix.target }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz, mac: true }
          - { os: macos-14, target: x86_64-apple-darwin, ext: tar.gz, mac: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, ext: tar.gz, linker: gcc-aarch64-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust + target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross linker (linux-arm64)
        if: matrix.linker != ''
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          key: release-${{ matrix.target }}

      # The binary reports `concat!("daemon-", env!("CARGO_PKG_VERSION"))`, and
      # `env!` is COMPILE-TIME — so the resolved version has to be in the manifest
      # before cargo runs, or every build reports the PREVIOUS release's number.
      # Runs after the toolchain + cache so `cargo update` has both.
      #
      # POSIX awk + a temp file, never `sed -i`: its syntax differs across the GNU,
      # BSD, and git-bash seds this six-target matrix spans. Only the first
      # column-0 `version =` is rewritten — that's `[workspace.package]`, which
      # every crate inherits.
      - name: Stamp the resolved version
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            !done && /^version = "/ { print "version = \"" v "\""; done = 1; next }
            { print }
          ' Cargo.toml > Cargo.toml.stamped
          mv Cargo.toml.stamped Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          # Re-point the lock at the stamped version so the `--locked` builds below
          # still hold. `--workspace` touches ONLY the workspace members; every
          # third-party pin stays exactly as committed, so `--locked` keeps its
          # supply-chain guarantee.
          cargo update --workspace

      # One target publishes the stamped manifest so the release job can commit
      # BYTE-EXACTLY what was built, without needing a Rust toolchain of its own.
      # All six targets stamp identically; picking one avoids six racing uploads.
      - name: Upload the stamped manifest
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: stamped-manifest
          path: |
            daemon/Cargo.toml
            daemon/Cargo.lock
          if-no-files-found: error

      # `ort` downloads and STATICALLY links a prebuilt ONNX Runtime on five of our
      # six targets, but publishes none for x86_64-apple-darwin. Microsoft ships a
      # macOS x86_64 build — dylibs only, no static archive — so that one target
      # links DYNAMICALLY against theirs and the dylib ships beside the binary.
      #
      # Three things all have to be right, and each was wrong at some point while
      # working this out:
      #   · ORT_LIB_LOCATION is used verbatim as the link search path, so it must be
      #     the tarball's `lib/` DIRECTORY, not its root (`library 'onnxruntime' not
      #     found` otherwise);
      #   · without ORT_PREFER_DYNAMIC_LINK, ort hunts for `libonnxruntime.a`, does
      #     not find one, and merely LOGS — emitting no link directives at all, so
      #     the failure surfaces as undefined symbols much later;
      #   · the binary needs an `@executable_path` rpath, because the dylib will sit
      #     beside it in `~/.modelstat/bin` rather than in a system library path.
      #
      # `_setup-runtime` and the self-updater both carry any sidecar library found
      # beside the binaries (see `modelstat_service::sidecar_libraries`), so the
      # dylib survives installation AND every later auto-update.
      - name: Fetch ONNX Runtime (Intel macOS only)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION=1.22.0
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          mkdir -p /tmp/ort && tar -xzf /tmp/ort.tgz -C /tmp/ort --strip-components=1
          test -f /tmp/ort/lib/libonnxruntime.dylib || { echo "no dylib in the tarball"; exit 1; }
          echo "ORT_LIB_LOCATION=/tmp/ort/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,@executable_path" >> "$GITHUB_ENV"
          ls -la /tmp/ort/lib

      - name: Build both binaries (release)
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          # Collector: opt into BOTH on-device models — `candle` is the BGE embedder,
          # `onnx` is the redactor (OpenAI Privacy Filter). WITHOUT `onnx` the
          # redactor compiles out to a stub, and since EVERY mode now fail-closes on
          # an unscrubbed turn, flushes would hold forever and nothing would ever
          # ship. Both are CPU-only; the collector still links NO llama.cpp (plan D4).
          cargo build --release --locked --target ${{ matrix.target }} \
            -p modelstat-cli --features candle,onnx
          # Summariser engine built separately — it has no `candle` feature; its
          # llama.cpp backend is its own, env-gated switch.
          cargo build --release --locked --target ${{ matrix.target }} \
            -p modelstat-summarizer

      # The macOS archives ship the prebuilt Swift tray (D15). Universal build so
      # both mac archives carry the same .app.
      - name: Build macOS tray
        if: matrix.mac
        working-directory: .
        run: TRAY_UNIVERSAL=1 bash apps/tray-mac/build-app.sh

      # Developer-ID codesign + notarize the tray ONLY when the Apple secrets are
      # present. The collector/engine CLI binaries are installed via curl|sh (not
      # a browser download), so they carry no quarantine bit and run unsigned; it
      # is the launchable .app that Gatekeeper checks. Absent creds → ad-hoc.
      - name: Codesign + notarize tray (macOS, when configured)
        if: matrix.mac && env.APPLE_TEAM_ID != ''
        working-directory: .
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          APP="apps/tray-mac/build/ModelstatTray.app"
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: ($APPLE_TEAM_ID)" "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/tray.zip"
          echo "$APPLE_NOTARY_KEY" | base64 -d > "$RUNNER_TEMP/nk.p8"
          xcrun notarytool submit "$RUNNER_TEMP/tray.zip" \
            --key "$RUNNER_TEMP/nk.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER" --wait
          xcrun stapler staple "$APP"

      - name: Package archive
        id: pkg
        shell: bash
        run: |
          V="${{ needs.gate.outputs.version }}"
          T="${{ matrix.target }}"
          NAME="modelstat-${V}-${T}"
          BIN="target/${T}/release"
          STAGE="$(mktemp -d)"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp "${BIN}/modelstat.exe" "${BIN}/modelstat-summarizer.exe" "$STAGE/"
          else
            cp "${BIN}/modelstat" "${BIN}/modelstat-summarizer" "$STAGE/"
          fi
          if [ "${{ matrix.mac }}" = "true" ] && [ -d "../apps/tray-mac/build/ModelstatTray.app" ]; then
            cp -R "../apps/tray-mac/build/ModelstatTray.app" "$STAGE/"
          fi
          # Intel macOS links ONNX Runtime dynamically (see the fetch step), so the
          # dylib travels in the archive and lands beside the binaries. Copied by the
          # name the binary actually asks for — `otool -L` shows the VERSIONED name —
          # and verified, because a silently-absent dylib is an install that dies at
          # first launch with `dyld: Library not loaded`.
          if [ "$T" = "x86_64-apple-darwin" ]; then
            cp /tmp/ort/lib/libonnxruntime*.dylib "$STAGE/" 2>/dev/null || true
            NEEDED="$(otool -L "${BIN}/modelstat" | awk '/libonnxruntime/ {print $1}' | sed 's|@rpath/||')"
            test -n "$NEEDED" || { echo "the collector is not linked against ONNX Runtime"; exit 1; }
            test -f "$STAGE/$NEEDED" || { echo "archive is missing $NEEDED"; exit 1; }
            echo "shipping $NEEDED beside the binaries"
          fi
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            ( cd "$STAGE" && 7z a -tzip "$OLDPWD/dist/${NAME}.zip" . >/dev/null )
          else
            tar -czf "dist/${NAME}.tar.gz" -C "$STAGE" .
          fi
          ASSET="dist/${NAME}.${{ matrix.ext }}"
          # Per-target sha256 line (target-named so the release job can concat).
          if command -v sha256sum >/dev/null; then
            ( cd dist && sha256sum "${NAME}.${{ matrix.ext }}" > "${NAME}.${{ matrix.ext }}.sha256" )
          else
            ( cd dist && shasum -a 256 "${NAME}.${{ matrix.ext }}" > "${NAME}.${{ matrix.ext }}.sha256" )
          fi
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            daemon/dist/*.${{ matrix.ext }}
            daemon/dist/*.sha256
          if-no-files-found: error

  # ---- Assemble SHA256SUMS, sign, publish the GitHub Release --------------
  release:
    needs: [gate, build]
    runs-on: ubuntu-latest
    # Most steps here work on `artifacts/` (the downloaded build output) rather
    # than `daemon/`, so this job does not inherit the workflow-level
    # `working-directory: daemon`. Steps that need the manifest say so themselves.
    defaults:
      run:
        working-directory: .
    steps:
      # Checkout FIRST: `actions/checkout` wipes the workspace, which would take
      # the downloaded artifacts with it. Needed here (this job used to have none)
      # so the version bump can be committed back to main below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble SHA256SUMS
        working-directory: artifacts
        run: |
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "── SHA256SUMS ──"; cat SHA256SUMS

      # minisign the checksums when the release key is configured (§13 / D10).
      - name: Sign SHA256SUMS (minisign, when configured)
        if: env.MINISIGN_SECRET_KEY != ''
        working-directory: artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          minisign -S -s minisign.key -m SHA256SUMS -x SHA256SUMS.minisig
          rm -f minisign.key

      # Record the version the build just stamped, so `daemon/Cargo.toml` on main
      # keeps naming the last release (a local `cargo build` then reports the
      # right number, and the seed path above has something to read). Same
      # mechanism the npm half already uses — see the "Tag, bump main" step in
      # release-daemon.yml.
      #
      # This can't re-trigger the workflow: pushes made with GITHUB_TOKEN don't
      # start new runs, and `[skip ci]` says so a second time. Skipped entirely on
      # a tag push or manual dispatch, which don't own main's contents.
      - name: Commit the version bump back to main
        id: bump
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The build's own stamped files, not a re-derivation — so what lands on
          # main is exactly what produced the binaries. (merge-multiple flattens
          # the artifact, hence the bare names.)
          cp artifacts/Cargo.toml daemon/Cargo.toml
          cp artifacts/Cargo.lock daemon/Cargo.lock
          grep -m1 '^version = ' daemon/Cargo.toml

          if git diff --quiet -- daemon/Cargo.toml daemon/Cargo.lock; then
            echo "manifest already at $VERSION — nothing to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add daemon/Cargo.toml daemon/Cargo.lock
          git commit -m "release: daemon v$VERSION [skip ci]"

          # Rebase-retry: another merge can land while the six targets build.
          pushed=0
          for i in 1 2 3; do
            git fetch origin main --quiet
            if git rebase origin/main && git push origin HEAD:main; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          [ "$pushed" = 1 ] || { echo "::error::failed to push the version bump for $VERSION"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The version decides GA vs pre-release (see the header): plain x.y.z ships
      # GA and becomes `releases/latest`, which is what the installer resolves and
      # what the server reports to daemons as the auto-update target. A semver
      # pre-release (1.1.0-rc.1) stays out of `latest`.
      #
      # This step also CREATES the `daemon-<version>` tag when it doesn't exist
      # yet (the merge-to-main path) — that is what removes the manual tag push.
      #
      # The tag points at the bump commit, so checking out `daemon-1.2.3` gives a
      # manifest that actually reads 1.2.3. Its only difference from the built
      # tree is that same version line, which the build stamped in anyway. Falls
      # back to the triggering SHA when the bump step was skipped (tag push /
      # manual dispatch).
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daemon-${{ needs.gate.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.sha || github.sha }}
          name: modelstat daemon ${{ needs.gate.outputs.version }}
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          # SHA256SUMS.minisig exists only when the minisign key is configured;
          # don't fail the publish when it's absent. The six archives + SHA256SUMS
          # are always present (the build gates on if-no-files-found: error).
          fail_on_unmatched_files: false
          files: |
            artifacts/modelstat-*.tar.gz
            artifacts/modelstat-*.zip
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.minisig
