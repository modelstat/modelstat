[package]
name = "modelstat-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Collector-side summarization: segmentation, the six frozen prompts, the passes
# (over the summarizer protocol), and the resilient hold-and-retry wrapper. NER +
# embeddings run here via candle (added behind traits). No llama.cpp (plan D4).
[dependencies]
modelstat-wire.workspace = true
modelstat-redact.workspace = true
modelstat-sumclient.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
