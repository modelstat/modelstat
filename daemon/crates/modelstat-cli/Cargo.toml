[package]
name = "modelstat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The collector binary. Named `modelstat` on disk (§2 command map).
[[bin]]
name = "modelstat"
path = "src/main.rs"

# CRITICAL BOUNDARY (plan §3, D4): the collector links NO llama.cpp. There is
# deliberately no `modelstat-llm` dependency here, direct or transitive, and CI
# asserts it via `cargo tree`. Do not add one.
[dependencies]
modelstat-log.workspace = true
modelstat-wire.workspace = true
modelstat-redact.workspace = true
modelstat-daemon.workspace = true
modelstat-mcp.workspace = true
modelstat-parsers.workspace = true
modelstat-ingest.workspace = true
modelstat-service.workspace = true
modelstat-update.workspace = true
modelstat-sumclient.workspace = true
# M1 collector commands: the device flow is async (reqwest via modelstat-ingest);
# serde renders the `--json` shapes (structs, so key order is preserved).
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Opt into the real on-device candle models (BGE embedder + BERT-NER) for a
# release/verified collector build. Forwards to modelstat-daemon. Still NO
# llama.cpp in this binary (plan §3, D4) — candle is CPU embeddings + NER only.
candle = ["modelstat-daemon/candle"]

[dev-dependencies]
# The prod/CI register-guard test drives the built binary in a throwaway home.
tempfile = "3"
