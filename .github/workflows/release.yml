name: Release

# One-click release. Run from the Actions tab (Release → Run workflow) or
#   gh workflow run release.yml -f package=agent -f release_type=patch
# Pick a package and a semver bump (patch/minor/major) — or pass an explicit
# `version`, or `release_type=none` to ship whatever the package.json already
# says. The workflow automates the ENTIRE release:
#   bump package.json → build → publish to npm → commit the bump to main →
#   tag <pkg>-v<version> → cut a GitHub Release → (agent) bump the Homebrew tap.
# No manual git, no tag pushing, no OTP.
#
# Auth & permissions:
#   • npm — NPM_TOKEN repo secret (an npm **Automation** token, which bypasses
#     2FA in CI). Set once: gh secret set NPM_TOKEN --repo modelstat/modelstat
#   • git — the bump commit + tag are pushed to main with GITHUB_TOKEN
#     (contents: write). GITHUB_TOKEN pushes don't trigger workflows, so
#     nothing re-fires.
#   • Optional HOMEBREW_TAP_DISPATCH_TOKEN — PAT to dispatch the tap bump; the
#     step no-ops (doesn't fail) when it's absent.
#
# Safety: npm publish runs BEFORE any push to main, and is skipped if the
# version is already on npm — so a failed publish leaves main untouched, and a
# re-run after a partial failure recovers cleanly instead of double-publishing.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        type: choice
        options: ["agent", "mcp"]
        default: "agent"
      release_type:
        description: "Semver bump (ignored when 'version' is set; 'none' = ship current package.json)"
        type: choice
        options: ["patch", "minor", "major", "none"]
        default: "patch"
      version:
        description: "Explicit version X.Y.Z (optional; overrides release_type)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.event.inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit + tag, cut the GitHub Release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve target package
        id: pkg
        run: |
          case "${{ github.event.inputs.package }}" in
            agent)
              { echo "dir=apps/agent-dev"; echo "name=modelstat";
                echo "filter=./apps/agent-dev"; echo "tag_prefix=agent-v";
                echo "is_agent=true"; } >> "$GITHUB_OUTPUT" ;;
            mcp)
              { echo "dir=packages/mcp"; echo "name=@modelstat/mcp";
                echo "filter=@modelstat/mcp"; echo "tag_prefix=mcp-v";
                echo "is_agent=false"; } >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown package '${{ github.event.inputs.package }}'"; exit 1 ;;
          esac

      - name: Compute & write new version
        id: ver
        env:
          RT: ${{ github.event.inputs.release_type }}
          VER: ${{ github.event.inputs.version }}
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          NEW="$(node -e '
            const fs = require("fs");
            const p = process.env.DIR + "/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            let nv = (process.env.VER || "").trim();
            if (!nv) {
              const t = process.env.RT;
              if (t === "none") {
                nv = j.version;
              } else {
                let [a, b, c] = j.version.split(".").map(Number);
                if (t === "major") { a++; b = 0; c = 0; }
                else if (t === "minor") { b++; c = 0; }
                else { c++; }
                nv = a + "." + b + "." + c;
              }
            }
            if (!/^[0-9]+\.[0-9]+\.[0-9]+/.test(nv)) {
              console.error("invalid version: " + nv); process.exit(1);
            }
            j.version = nv;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            process.stdout.write(nv);
          ')"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.pkg.outputs.tag_prefix }}$NEW" >> "$GITHUB_OUTPUT"
          echo "Releasing ${{ steps.pkg.outputs.name }}@$NEW (tag ${{ steps.pkg.outputs.tag_prefix }}$NEW)"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ steps.pkg.outputs.filter }}" build

      # Irreversible step first: publish before touching main, and skip if the
      # version is already on npm so a recovery re-run doesn't fail.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NAME: ${{ steps.pkg.outputs.name }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if npm view "$NAME@$V" version >/dev/null 2>&1; then
            echo "$NAME@$V already on npm — skipping publish (recovery re-run)."
          else
            pnpm --filter "${{ steps.pkg.outputs.filter }}" publish --access public --no-git-checks
          fi

      - name: Commit bump + push tag to main
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          NAME: ${{ steps.pkg.outputs.name }}
          V: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$DIR/package.json"; then
            echo "No version change to commit (already at $V)."
          else
            git add "$DIR/package.json"
            git commit -m "release: $NAME v$V"
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pkg.outputs.name }}
          V: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$NAME $V" --generate-notes

      - name: Bump Homebrew tap
        if: ${{ steps.pkg.outputs.is_agent == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN not set — skipping homebrew bump."
            exit 0
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" \
            /repos/modelstat/homebrew-tap/dispatches \
            -f "event_type=agent-released" \
            -f "client_payload[version]=${VERSION}"
